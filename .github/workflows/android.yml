name: Build & test TaskMind AI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: taskmind-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests + debug APK
        id: build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug assembleDebugAndroidTest 2>&1 | tee build.log
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/TaskMindAI.apk

      - name: Upload APK artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: TaskMindAI-apk
          path: output/TaskMindAI.apk

      - name: Enable KVM for the emulator
        if: steps.build.outcome == 'success'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests on Android 14 emulator
        id: emu
        if: steps.build.outcome == 'success'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell settings put global hide_error_dialogs 1 || true
            adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS || true
            ./gradlew --no-daemon connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true > emulator.log 2>&1 || echo "INSTRUMENTED_TESTS_FAILED" >> emulator.log
            mkdir -p ci/screenshots
            adb pull /sdcard/Android/data/com.taskmind.ai/files/screenshots/. ci/screenshots/ || true
            adb shell am force-stop com.taskmind.ai || true
            adb shell am start -W -n com.taskmind.ai/.MainActivity > ci/cold_start.txt 2>&1 || true
            sleep 6
            adb exec-out screencap -p > ci/screenshots/99_cold_launch.png || true
            adb logcat -d -t 4000 > ci/logcat.txt || true

      - name: Publish results to ci-results branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ci/reports
          cp build.log ci/ 2>/dev/null || true
          cp emulator.log ci/ 2>/dev/null || true
          cp output/TaskMindAI.apk ci/ 2>/dev/null || true
          cp -r app/build/reports/tests ci/reports/unit 2>/dev/null || true
          cp -r app/build/reports/androidTests ci/reports/android 2>/dev/null || true
          cp -r app/build/outputs/androidTest-results ci/reports/android-results 2>/dev/null || true
          echo "sha=${GITHUB_SHA} build=${{ steps.build.outcome }} emulator=${{ steps.emu.outcome }} run=${{ github.run_number }}" > ci/STATUS.txt
          cd ci
          git init -q
          git checkout -q -b ci-results
          git add -A
          git -c user.name="taskmind-ci" -c user.email="ci@users.noreply.github.com" commit -qm "CI results for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-results

      - name: Publish GitHub release with APK
        if: steps.build.outcome == 'success' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" output/TaskMindAI.apk \
            --title "TaskMind AI 1.0 (build ${{ github.run_number }})" \
            --notes "Signed debug APK built from ${GITHUB_SHA::7}. Requires Android 10 or newer. Emulator tests: ${{ steps.emu.outcome }}."
